# ============================================================
# Online Boutique - Google Microservices Demo
# ============================================================
# Aplikasi e-commerce microservices dengan 11 layanan yang
# saling terhubung. Ideal untuk riset XFSCI karena:
# - Memiliki dependensi antar-service yang kompleks
# - Menghasilkan metrik CPU/RAM/Network yang realistis  
# - Mudah di-inject fault untuk menghasilkan data anomali
#
# Deploy:
#   kubectl apply -f online-boutique.yaml -n demo
#
# Sumber: https://github.com/GoogleCloudPlatform/microservices-demo
# ============================================================
# 
# Topologi Service (untuk GNN Layer 2):
#
#                  ┌──────────┐
#                  │ Frontend │
#                  └────┬─────┘
#        ┌──────┬──────┬┴──────┬──────┬──────┐
#        ▼      ▼      ▼       ▼      ▼      ▼
#    ┌──────┐┌─────┐┌──────┐┌─────┐┌──────┐┌────────┐
#    │ Cart ││ Ad  ││Recomm.││Curr.││Check-││Shipping│
#    │ Svc  ││ Svc ││ Svc   ││ Svc ││ out  ││  Svc   │
#    └──┬───┘└─────┘└──┬────┘└─────┘└──┬───┘└────────┘
#       ▼              ▼               ▼
#   ┌───────┐    ┌──────────┐    ┌──────────┐
#   │ Redis │    │ Product  │    │ Payment  │
#   │ Cart  │    │ Catalog  │    │  Svc     │
#   └───────┘    └──────────┘    └──┬───────┘
#                                   ▼
#                              ┌──────────┐
#                              │  Email   │
#                              │  Svc     │
#                              └──────────┘
# ============================================================

apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    app: online-boutique
    xfsci-monitored: "true"

---
# ==================== FRONTEND ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: frontend
          image: gcr.io/google-samples/microservices-demo/frontend:v0.10.1
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice:3550"
            - name: CURRENCY_SERVICE_ADDR
              value: "currencyservice:7000"
            - name: CART_SERVICE_ADDR
              value: "cartservice:7070"
            - name: RECOMMENDATION_SERVICE_ADDR
              value: "recommendationservice:8080"
            - name: SHIPPING_SERVICE_ADDR
              value: "shippingservice:50051"
            - name: CHECKOUT_SERVICE_ADDR
              value: "checkoutservice:5050"
            - name: AD_SERVICE_ADDR
              value: "adservice:9555"
            - name: ENABLE_ASSISTANT
              value: "false"
            - name: SHOPPING_ASSISTANT_SERVICE_ADDR
              value: "shoppingassistantservice:80"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /_healthz
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /_healthz
              port: 8080
            initialDelaySeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080

---
# ==================== CART SERVICE ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cartservice
  template:
    metadata:
      labels:
        app: cartservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7070"
    spec:
      containers:
        - name: cartservice
          image: gcr.io/google-samples/microservices-demo/cartservice:v0.10.1
          ports:
            - containerPort: 7070
          env:
            - name: REDIS_ADDR
              value: "redis-cart:6379"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            grpc:
              port: 7070
            initialDelaySeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  namespace: demo
spec:
  selector:
    app: cartservice
  ports:
    - port: 7070
      targetPort: 7070

---
# ==================== REDIS (Cart DB) ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cart
  template:
    metadata:
      labels:
        app: redis-cart
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "70m"
              memory: "128Mi"
            limits:
              cpu: "125m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: redis-cart
  namespace: demo
spec:
  selector:
    app: redis-cart
  ports:
    - port: 6379
      targetPort: 6379

